<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Invitation cards</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Great+Vibes&family=Jost:wght@300;400;500&family=Cinzel:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=block" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body.wide, body.wide html { width: 1200px; height: 630px; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; text-align: center; }
  .abs { position: absolute; }
  .qr { display: inline-block; padding: 12px; border-radius: 10px; }
  .qr img, .qr canvas { display: block; width: 150px !important; height: 150px !important; }
  .link { font-family: "Jost"; font-size: 21px; letter-spacing: .04em; }
  .scan { font-family: "Jost"; font-size: 17px; letter-spacing: .3em; text-transform: uppercase; }

  /* ========== 1. ROYAL MAROON & GOLD ========== */
  .d1 { background: radial-gradient(ellipse at 50% 38%, #7a1a2c 0%, #4a0d18 55%, #26050c 100%); color: #f3e2bd; }
  .d1 .frame { inset: 34px; border: 2px solid rgba(232,201,138,.65); }
  .d1 .frame2 { inset: 48px; border: 1px solid rgba(232,201,138,.3); }
  .d1 .mandala { width: 980px; left: 50px; top: 150px; color: #e8c98a; opacity: .13; }
  .gold { background: linear-gradient(120deg,#a8772f 0%,#f3dca6 28%,#c8994a 50%,#fbe9bf 72%,#a8772f 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .d1 .inner { position: relative; padding-top: 112px; }
  .d1 .om { font-family: "Cinzel"; font-size: 22px; letter-spacing: .3em; color: #e8c98a; }
  .d1 .eyebrow { font-family: "Jost"; font-weight: 300; font-size: 21px; letter-spacing: .45em; text-transform: uppercase; margin-top: 40px; opacity: .85; }
  .d1 .nm { font-family: "Pinyon Script"; font-size: 150px; line-height: 1.12; }
  .d1 .weds { font-family: "Cormorant Garamond"; font-style: italic; font-size: 40px; color: #fbf6ee; margin: 2px 0; }
  .d1 .weds:before, .d1 .weds:after { content: ""; display: inline-block; width: 90px; height: 1px; background: #e8c98a; vertical-align: middle; margin: 0 26px; }
  .d1 .date { font-family: "Cinzel"; font-size: 40px; letter-spacing: .14em; margin-top: 34px; color: #fbf6ee; }
  .d1 .events { display: flex; justify-content: center; gap: 30px; margin-top: 40px; }
  .d1 .ev { width: 380px; padding: 28px 18px 24px; border: 1px solid rgba(232,201,138,.5); border-radius: 190px 190px 14px 14px; background: rgba(255,255,255,.04); }
  .d1 .ev h4 { font-family: "Cinzel"; font-weight: 500; font-size: 30px; letter-spacing: .14em; color: #e8c98a; }
  .d1 .ev p { font-family: "Cormorant Garamond"; font-size: 29px; line-height: 1.3; color: #fbf6ee; }
  .d1 .ev small { font-family: "Jost"; font-size: 17px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
  .d1 .venue { font-family: "Cormorant Garamond"; font-size: 33px; margin-top: 34px; color: #fbf6ee; }
  .d1 .venue b { font-weight: 600; color: #e8c98a; display: block; font-size: 38px; }
  .d1 .foot { left: 0; right: 0; bottom: 74px; display: flex; align-items: center; justify-content: center; gap: 28px; }
  .d1 .qr { background: #fbf6ee; }
  .d1 .foot .txt { text-align: left; }
  .d1 .scan { color: #e8c98a; }
  .d1 .link { color: #fbf6ee; margin-top: 8px; }

  /* ========== 2. IVORY MINIMAL ARCH ========== */
  .d2 { background: #f7f1e6; color: #3b2f27; }
  .d2 .arch { left: 120px; right: 120px; top: 90px; bottom: 90px; border: 2px solid #b8893b; border-radius: 420px 420px 0 0; }
  .d2 .arch2 { left: 138px; right: 138px; top: 108px; bottom: 108px; border: 1px solid rgba(184,137,59,.45); border-radius: 402px 402px 0 0; }
  .d2 .inner { position: relative; padding-top: 180px; }
  .d2 .mono { font-family: "Playfair Display"; font-size: 64px; letter-spacing: .15em; color: #b8893b; }
  .d2 .mono i { font-family: "Pinyon Script"; font-style: normal; font-size: 54px; margin: 0 10px; color: #3b2f27; }
  .d2 .eyebrow { font-family: "Jost"; font-size: 18px; letter-spacing: .5em; text-transform: uppercase; margin-top: 46px; color: #8a7466; }
  .d2 .nm { font-family: "Playfair Display"; font-weight: 400; font-size: 76px; line-height: 1.12; letter-spacing: .04em; text-transform: uppercase; margin-top: 30px; }
  .d2 .and { font-family: "Pinyon Script"; font-size: 70px; color: #b8893b; line-height: 1; margin: 8px 0; }
  .d2 .rule { width: 120px; height: 1px; background: #b8893b; margin: 32px auto; }
  .d2 .date { font-family: "Jost"; font-weight: 300; font-size: 30px; letter-spacing: .35em; text-transform: uppercase; }
  .d2 .date b { display: block; font-family: "Playfair Display"; font-weight: 400; font-size: 86px; letter-spacing: .05em; line-height: 1.1; color: #b8893b; }
  .d2 .events { display: flex; justify-content: center; gap: 0; margin-top: 34px; font-family: "Cormorant Garamond"; font-size: 28px; }
  .d2 .events div { padding: 0 38px; }
  .d2 .events div + div { border-left: 1px solid #b8893b; }
  .d2 .events h4 { font-family: "Jost"; font-weight: 500; font-size: 17px; letter-spacing: .35em; text-transform: uppercase; color: #b8893b; margin-bottom: 6px; }
  .d2 .venue { font-family: "Cormorant Garamond"; font-style: italic; font-size: 30px; margin-top: 24px; color: #5a4a3e; }
  .d2 .foot { left: 0; right: 0; bottom: 122px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d2 .qr { background: #fff; border: 1px solid rgba(184,137,59,.5); }
  .d2 .qr img, .d2 .qr canvas { width: 120px !important; height: 120px !important; }
  .d2 .foot .txt { text-align: left; }
  .d2 .scan { color: #b8893b; font-size: 15px; }
  .d2 .link { color: #5a4a3e; font-size: 19px; margin-top: 6px; }

  /* ========== 3. SAGE BOTANICAL ========== */
  .d3 { background: radial-gradient(ellipse at 50% 45%, #fbfaf4 0%, #eef1e6 70%, #dfe6d3 100%); color: #3d4a3a; }
  .d3 svg.branch { position: absolute; width: 330px; height: 330px; color: #7d9471; }
  .d3 .b1 { top: -30px; left: -50px; }
  .d3 .b2 { bottom: -30px; right: -50px; transform: rotate(180deg); }
  .d3 .b3 { top: -30px; right: -50px; transform: scaleX(-1); opacity: .75; }
  .d3 .b4 { bottom: -30px; left: -50px; transform: rotate(180deg) scaleX(-1); opacity: .75; }
  .d3 .inner { position: relative; padding-top: 200px; }
  .d3 .om { font-family: "Jost"; font-size: 18px; letter-spacing: .4em; text-transform: uppercase; color: #7d9471; }
  .d3 .eyebrow { font-family: "Cormorant Garamond"; font-style: italic; font-size: 34px; margin-top: 46px; color: #5b6b56; }
  .d3 .nm { font-family: "Great Vibes"; font-size: 140px; line-height: 1.1; color: #3d4a3a; }
  .d3 .and { font-family: "Cormorant Garamond"; font-style: italic; font-size: 44px; color: #a68a4f; }
  .d3 .date { margin-top: 34px; display: flex; justify-content: center; align-items: center; gap: 30px; font-family: "Jost"; letter-spacing: .25em; text-transform: uppercase; font-size: 24px; color: #5b6b56; }
  .d3 .date .day { font-family: "Cormorant Garamond"; font-size: 108px; letter-spacing: 0; line-height: 1; color: #a68a4f; padding: 0 30px; border-left: 1px solid #a68a4f; border-right: 1px solid #a68a4f; }
  .d3 .date span { width: 190px; padding: 14px 0; border-top: 1px solid #a68a4f; border-bottom: 1px solid #a68a4f; }
  .d3 .events { margin-top: 36px; font-family: "Cormorant Garamond"; font-size: 30px; line-height: 1.55; }
  .d3 .events b { font-family: "Jost"; font-weight: 500; font-size: 18px; letter-spacing: .32em; text-transform: uppercase; color: #7d9471; margin-right: 14px; }
  .d3 .venue { font-family: "Cormorant Garamond"; font-size: 31px; margin-top: 22px; }
  .d3 .venue b { font-weight: 600; }
  .d3 .foot { left: 0; right: 0; bottom: 80px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d3 .qr { background: #fff; box-shadow: 0 8px 24px rgba(61,74,58,.12); }
  .d3 .qr img, .d3 .qr canvas { width: 130px !important; height: 130px !important; }
  .d3 .foot .txt { text-align: left; }
  .d3 .scan { color: #7d9471; font-size: 15px; }
  .d3 .link { color: #3d4a3a; font-size: 19px; margin-top: 6px; }

  /* ========== 4. TEMPLE TRADITIONAL ========== */
  .d4 { background: radial-gradient(ellipse at 50% 55%, #b3141f 0%, #8a0d17 55%, #5c0710 100%); color: #fff3d6; }
  .d4 .border { inset: 26px; border: 10px solid transparent;
     border-image: repeating-linear-gradient(45deg, #f2b51c 0 12px, #8a0d17 12px 24px) 10; }
  .d4 .border2 { inset: 48px; border: 2px solid #f2b51c; }
  .d4 svg.toran { position: absolute; top: 48px; left: 48px; width: 984px; height: 200px; }
  .d4 .inner { position: relative; padding-top: 220px; }
  .d4 .om { font-family: "Cinzel"; font-weight: 600; font-size: 24px; letter-spacing: .25em; color: #f8c94a; }
  .d4 .bl { font-family: "Cormorant Garamond"; font-style: italic; font-size: 25px; margin-top: 10px; color: #fde3a7; opacity: .9; }
  .d4 .eyebrow { font-family: "Jost"; font-size: 19px; letter-spacing: .4em; text-transform: uppercase; margin-top: 34px; color: #f8c94a; }
  .d4 .nm { font-family: "Cinzel"; font-weight: 600; font-size: 74px; letter-spacing: .06em; line-height: 1.15; color: #f8c94a; text-shadow: 0 3px 0 #5c0710; }
  .d4 .and { font-family: "Pinyon Script"; font-size: 64px; color: #fff3d6; line-height: 1.1; }
  .d4 .lamp { width: 90px; margin: 30px auto 0; color: #f8c94a; }
  .d4 .events { display: flex; justify-content: center; gap: 26px; margin-top: 28px; }
  .d4 .ev { width: 400px; padding: 24px 16px; background: #fff3d6; color: #6b0a13; border-radius: 12px; border: 3px solid #f2b51c; box-shadow: 0 10px 0 #5c0710; }
  .d4 .ev h4 { font-family: "Cinzel"; font-weight: 600; font-size: 30px; letter-spacing: .1em; color: #b3141f; }
  .d4 .ev p { font-family: "Cormorant Garamond"; font-weight: 600; font-size: 29px; line-height: 1.3; }
  .d4 .ev small { font-family: "Jost"; font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: #8a5a10; }
  .d4 .venue { font-family: "Cormorant Garamond"; font-size: 30px; margin-top: 38px; }
  .d4 .venue b { font-family: "Cinzel"; font-weight: 600; font-size: 30px; letter-spacing: .04em; color: #f8c94a; display: block; }
  .d4 .foot { left: 0; right: 0; bottom: 76px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d4 .qr { background: #fff3d6; border: 3px solid #f2b51c; }
  .d4 .qr img, .d4 .qr canvas { width: 130px !important; height: 130px !important; }
  .d4 .foot .txt { text-align: left; }
  .d4 .scan { color: #f8c94a; font-size: 15px; }
  .d4 .link { color: #fff3d6; font-size: 19px; margin-top: 6px; }

  /* ========== 5. MIDNIGHT EMERALD LUXE (art deco) ========== */
  .d5 { background: radial-gradient(ellipse at 50% 40%, #0f4a3c 0%, #08302a 55%, #041a17 100%); color: #f1e6cc; }
  .d5 svg.deco { position: absolute; left: 0; width: 1080px; height: 260px; color: #d4af6a; }
  .d5 .top { top: 0; }
  .d5 .bot { bottom: 0; transform: scaleY(-1); }
  .d5 .frame { inset: 40px; border: 1.5px solid rgba(212,175,106,.6); }
  .d5 .inner { position: relative; padding-top: 190px; }
  .d5 .save { font-family: "Cinzel"; font-size: 26px; letter-spacing: .6em; color: #d4af6a; }
  .d5 .nm { font-family: "Playfair Display"; font-style: italic; font-size: 96px; line-height: 1.12; margin-top: 26px; }
  .d5 .and { font-family: "Cinzel"; font-size: 34px; letter-spacing: .3em; color: #d4af6a; margin: 10px 0; }
  .d5 .diamond { width: 22px; height: 22px; border: 1.5px solid #d4af6a; transform: rotate(45deg); margin: 30px auto; }
  .d5 .big { font-family: "Cinzel"; font-size: 118px; line-height: 1; letter-spacing: .08em; }
  .d5 .big small { display: block; font-size: 28px; letter-spacing: .5em; color: #d4af6a; margin-top: 16px; }
  .d5 .events { display: flex; justify-content: center; margin-top: 34px; }
  .d5 .events div { width: 380px; padding: 6px 20px; }
  .d5 .events div + div { border-left: 1px solid rgba(212,175,106,.6); }
  .d5 .events h4 { font-family: "Cinzel"; font-weight: 500; font-size: 24px; letter-spacing: .3em; color: #d4af6a; }
  .d5 .events p { font-family: "Cormorant Garamond"; font-size: 29px; line-height: 1.35; }
  .d5 .venue { font-family: "Cormorant Garamond"; font-style: italic; font-size: 30px; margin-top: 22px; }
  .d5 .foot { left: 0; right: 0; bottom: 76px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d5 .qr { background: #f1e6cc; }
  .d5 .qr img, .d5 .qr canvas { width: 120px !important; height: 120px !important; }
  .d5 .foot .txt { text-align: left; }
  .d5 .scan { color: #d4af6a; font-size: 15px; }
  .d5 .link { color: #f1e6cc; font-size: 19px; margin-top: 6px; }

  /* ========== 6. LINK PREVIEW (1200x630) ========== */
  .d6 { width: 1200px; height: 630px; background: radial-gradient(ellipse at 50% 45%, #7a1a2c 0%, #4a0d18 60%, #26050c 100%); color: #fbf6ee; }
  .d6 .frame { inset: 22px; border: 2px solid rgba(232,201,138,.6); }
  .d6 .mandala { width: 760px; left: 220px; top: -65px; color: #e8c98a; opacity: .12; }
  .d6 .inner { position: relative; padding-top: 74px; }
  .d6 .eyebrow { font-family: "Jost"; font-weight: 300; font-size: 20px; letter-spacing: .5em; text-transform: uppercase; color: #e8c98a; }
  .d6 .nm { font-family: "Pinyon Script"; font-size: 128px; line-height: 1.15; margin-top: 18px; }
  .d6 .nm i { font-family: "Cormorant Garamond"; font-size: 64px; color: #fbf6ee; margin: 0 18px; }
  .d6 .date { font-family: "Cinzel"; font-size: 36px; letter-spacing: .16em; margin-top: 26px; }
  .d6 .venue { font-family: "Cormorant Garamond"; font-style: italic; font-size: 30px; margin-top: 12px; color: #e8c98a; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SITE = "https://vincentthrives.github.io/arun-weds-likhitha/";
const LINK = "vincentthrives.github.io/arun-weds-likhitha";
const d = +(new URLSearchParams(location.search).get("d") || 1);

function mandala(rings) {
  let s = "";
  rings.forEach(([n, rx, ry, dist, sw]) => { for (let i = 0; i < n; i++) s += `<ellipse cx="0" cy="-${dist}" rx="${rx}" ry="${ry}" transform="rotate(${360 / n * i})" fill="none" stroke="currentColor" stroke-width="${sw}"/>`; });
  [40, 92, 150, 192].forEach(r => s += `<circle r="${r}" fill="none" stroke="currentColor" stroke-width=".7"/>`);
  for (let i = 0; i < 72; i++) s += `<circle cx="0" cy="-198" r="1.8" fill="currentColor" transform="rotate(${i * 5})"/>`;
  return `<svg class="abs mandala" viewBox="-200 -200 400 400">${s}</svg>`;
}
const M = () => mandala([[12, 14, 40, 52, 1.1], [24, 9, 30, 120, .9], [36, 5, 22, 170, .7], [8, 26, 60, 70, .7]]);

function branch(cls) {
  // curved stem with paired leaves
  let s = `<path d="M40 40 Q 260 120 470 420" fill="none" stroke="currentColor" stroke-width="3"/>`;
  for (let i = 1; i < 12; i++) {
    const t = i / 12, x = (1 - t) * (1 - t) * 40 + 2 * (1 - t) * t * 260 + t * t * 470, y = (1 - t) * (1 - t) * 40 + 2 * (1 - t) * t * 120 + t * t * 420;
    const ang = 20 + t * 40, sz = 34 - t * 12, op = .55 + (i % 3) * .15;
    s += `<ellipse cx="${x}" cy="${y - sz}" rx="${sz * .42}" ry="${sz}" fill="currentColor" opacity="${op}" transform="rotate(${ang - 60} ${x} ${y})"/>`;
    s += `<ellipse cx="${x}" cy="${y - sz}" rx="${sz * .42}" ry="${sz}" fill="currentColor" opacity="${op - .15}" transform="rotate(${ang + 70} ${x} ${y})"/>`;
  }
  s += `<circle cx="150" cy="70" r="12" fill="#e9d3c0"/><circle cx="150" cy="70" r="5" fill="#c9a36a"/><circle cx="330" cy="215" r="9" fill="#e9d3c0"/><circle cx="330" cy="215" r="4" fill="#c9a36a"/>`;
  return `<svg class="branch ${cls}" viewBox="0 0 560 560">${s}</svg>`;
}

function toran() {
  let s = `<path d="M0 18 Q 492 70 984 18" fill="none" stroke="#f2b51c" stroke-width="4"/>`;
  const n = 25;
  for (let i = 0; i <= n; i++) {
    const x = 984 * i / n, y = 18 + 52 * (1 - Math.pow((x - 492) / 492, 2));
    if (i % 2 === 0) {
      const len = 92 + (i % 4 === 0 ? 18 : 0), g = i % 4 === 0 ? "#2f7d32" : "#4f9a3a";
      s += `<path d="M${x} ${y} C ${x - 20} ${y + len * .35}, ${x - 12} ${y + len * .8}, ${x} ${y + len} C ${x + 12} ${y + len * .8}, ${x + 20} ${y + len * .35}, ${x} ${y}z" fill="${g}" stroke="#1f5a22" stroke-width="1.2"/>`;
      s += `<path d="M${x} ${y + 4} L ${x} ${y + len - 6}" stroke="#a8d08d" stroke-width="1.2"/>`;
    } else {
      for (let k = 0; k < 3; k++) s += `<circle cx="${x}" cy="${y + 16 + k * 24}" r="${12 - k}" fill="${k % 2 ? "#f2b51c" : "#f57c00"}"/><circle cx="${x}" cy="${y + 16 + k * 24}" r="4" fill="#c25e00"/>`;
    }
  }
  return `<svg class="toran" viewBox="0 0 984 200">${s}</svg>`;
}

function deco(cls) {
  let s = "";
  for (let i = 0; i <= 18; i++) { const a = Math.PI * i / 18; s += `<line x1="540" y1="0" x2="${540 + Math.cos(a) * 175}" y2="${Math.sin(a) * 175}" stroke="currentColor" stroke-width="1" opacity=".35"/>`; }
  [90, 130, 170].forEach((r, i) => s += `<path d="M${540 - r} 0 A ${r} ${r} 0 0 0 ${540 + r} 0" fill="none" stroke="currentColor" stroke-width="${i === 1 ? 2 : 1}"/>`);
  return `<svg class="deco ${cls}" viewBox="0 0 1080 260"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#041a17" stop-opacity="0"/><stop offset="1" stop-color="#08302a" stop-opacity=".9"/></linearGradient></defs>${s}</svg>`;
}

const lamp = `<svg class="lamp" viewBox="0 0 90 60"><path d="M45 4c-5 7-5 13 0 17 5-4 5-10 0-17z" fill="#ffd36b"/><path d="M8 30h74c-4 14-18 22-37 22S12 44 8 30z" fill="currentColor"/><path d="M30 52h30l-4 6H34z" fill="currentColor"/></svg>`;

const foot = (cls = "") => `<div class="abs foot ${cls}"><div class="qr" id="qr"></div><div class="txt"><div class="scan">Scan for location &amp; RSVP</div><div class="link">${LINK}</div></div></div>`;

const T = {
1: () => `<div class="card d1">${M()}<div class="abs frame"></div><div class="abs frame2"></div><div class="inner">
  <div class="om">|| Sri Ganeshaya Namaha ||</div>
  <div class="eyebrow">Together with their families</div>
  <div class="nm gold" style="margin-top:22px">Arun Gowda K</div>
  <div class="weds">weds</div>
  <div class="nm gold">Likhitha H K</div>
  <div class="date">12 · November · 2026</div>
  <div class="events">
    <div class="ev"><h4>RECEPTION</h4><p>Wednesday, 11 Nov<br>6:30 PM onwards</p><small>The Evening Celebration</small></div>
    <div class="ev"><h4>MUHURTHAM</h4><p>Thursday, 12 Nov<br>8:00 – 8:45 AM</p><small>Vrishchika Lagna</small></div>
  </div>
  <div class="venue"><b>Sri Annapoorneshwari Kalyana Mantapa</b>Sachin Layout, Jyothinagara, Sira</div>
</div>${foot()}</div>`,

2: () => `<div class="card d2"><div class="abs arch"></div><div class="abs arch2"></div><div class="inner">
  <div class="mono">A<i>&amp;</i>L</div>
  <div class="eyebrow">Request the pleasure of your company</div>
  <div class="nm">Arun Gowda K</div>
  <div class="and">&amp;</div>
  <div class="nm">Likhitha H K</div>
  <div class="rule"></div>
  <div class="date">Thursday<b>12.11.26</b>November</div>
  <div class="events">
    <div><h4>Reception</h4>Wed 11 Nov · 6:30 PM</div>
    <div><h4>Muhurtham</h4>Thu 12 Nov · 8:00 AM</div>
  </div>
  <div class="venue">Sri Annapoorneshwari Kalyana Mantapa, Sira</div>
</div>${foot()}</div>`,
