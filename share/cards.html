<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Invitation cards</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Great+Vibes&family=Jost:wght@300;400;500&family=Cinzel:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=block" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body.wide, body.wide html { width: 1200px; height: 630px; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; text-align: center; }

  .link { font-family: "Jost"; font-size: 21px; letter-spacing: .04em; }
  .scan { font-family: "Jost"; font-size: 17px; letter-spacing: .3em; text-transform: uppercase; }

  /* ========== 1. ROYAL MAROON & GOLD ========== */

  .d1 .ev .dd { font-family: "Cinzel"; font-weight: 500; font-size: 92px; line-height: 1; margin: 4px 0 2px; }

  .d1 .venue b { font-weight: 600; color: #e8c98a; display: block; font-size: 36px; }
  .d1 .foot { left: 0; right: 0; bottom: 62px; display: flex; align-items: center; justify-content: center; gap: 28px; }
  .d1 .qr { background: #fbf6ee; }
  .d1 .qr img, .d1 .qr canvas { width: 118px !important; height: 118px !important; }
  .d1 .foot .txt { text-align: left; }
  .d1 .scan { color: #e8c98a; }
  .d1 .link { color: #fbf6ee; margin-top: 8px; }

  /* ========== 2. IVORY MINIMAL ARCH ========== */

  .d2 .arch2 { left: 138px; right: 138px; top: 108px; bottom: 108px; border: 1px solid rgba(184,137,59,.45); border-radius: 402px 402px 0 0; }

  .d2 .scan { color: #b8893b; font-size: 15px; }
  .d2 .link { color: #5a4a3e; font-size: 19px; margin-top: 6px; }

  /* ========== 3. SAGE BOTANICAL ========== */

  .d3 .date .day { font-family: "Cormorant Garamond"; font-size: 108px; letter-spacing: 0; line-height: 1; color: #a68a4f; padding: 0 30px; border-left: 1px solid #a68a4f; border-right: 1px solid #a68a4f; }

  .d3 .venue { font-family: "Cormorant Garamond"; font-size: 31px; margin-top: 22px; }

  .d3 .foot .txt { text-align: left; }
  .d3 .scan { color: #7d9471; font-size: 15px; }
  .d3 .link { color: #3d4a3a; font-size: 19px; margin-top: 6px; }

  .d4 .ev p { font-family: "Cormorant Garamond"; font-weight: 600; font-size: 29px; line-height: 1.3; }
  .d4 .ev small { font-family: "Jost"; font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: #8a5a10; }
  .d4 .venue { font-family: "Cormorant Garamond"; font-size: 30px; margin-top: 38px; }
  .d4 .venue b { font-family: "Cinzel"; font-weight: 600; font-size: 30px; letter-spacing: .04em; color: #f8c94a; display: block; }
  .d4 .foot { left: 0; right: 0; bottom: 76px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d4 .qr { background: #fff3d6; border: 3px solid #f2b51c; }
  .d4 .qr img, .d4 .qr canvas { width: 130px !important; height: 130px !important; }
  .d4 .foot .txt { text-align: left; }
  .d4 .scan { color: #f8c94a; font-size: 15px; }
  .d4 .link { color: #fff3d6; font-size: 19px; margin-top: 6px; }

  /* ========== 5. MIDNIGHT EMERALD LUXE (art deco) ========== */

  .d5 .venue { font-family: "Cormorant Garamond"; font-style: italic; font-size: 30px; margin-top: 22px; }
  .d5 .foot { left: 0; right: 0; bottom: 76px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d5 .qr { background: #f1e6cc; }
  .d5 .qr img, .d5 .qr canvas { width: 120px !important; height: 120px !important; }
  .d5 .foot .txt { text-align: left; }
  .d5 .scan { color: #d4af6a; font-size: 15px; }
  .d5 .link { color: #f1e6cc; font-size: 19px; margin-top: 6px; }

  /* ========== 7. IVORY & GOLD (same layout as 1) ========== */

  .t7 .gold { background: linear-gradient(120deg,#7a4c14 0%,#c9963e 30%,#8a5a1c 50%,#d7a955 72%,#7a4c14 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t7 .frame { border-color: rgba(184,137,59,.8); }

  .t7 .om, .t7 .eyebrow { color: #9a6b28; }
  .t7 .weds { color: #7a1526; }
  .t7 .weds:before, .t7 .weds:after { background: #b8893b; }
  .t7 .ev { background: linear-gradient(180deg, #fffdf8, #f7ead0);
     box-shadow: 0 0 0 2px #b8893b, 0 0 0 9px #fbf3e2, 0 0 0 10px rgba(184,137,59,.55), 0 22px 44px rgba(122,21,38,.16), inset 0 0 50px rgba(184,137,59,.1); }
  .t7 .ev .ic, .t7 .ev .orn { color: #b8893b; }
  .t7 .ev .wd, .t7 .ev .mm { color: #5a1020; }
  .t7 .ev .tm { background: linear-gradient(120deg,#6a0f20,#a3243a 50%,#6a0f20); color: #fbe9bf; }
  .t7 .ev small { color: #9a6b28; }
  .t7 .venue { color: #5a1020; }
  .t7 .venue b { color: #7a1526; }
  .t7 .qr { background: #fff; box-shadow: 0 0 0 1px rgba(184,137,59,.6); }
  .t7 .scan { color: #9a6b28; }
  .t7 .link { color: #5a1020; }

  /* ========== 8. MIDNIGHT NAVY & GOLD (same layout as 1) ========== */
  .t8 { background: radial-gradient(ellipse at 50% 38%, #213668 0%, #121f42 55%, #070d20 100%); }
  .t8 .ev { background: linear-gradient(180deg, rgba(232,201,138,.15), rgba(7,13,32,.6));
     box-shadow: 0 0 0 2px #c8994a, 0 0 0 9px rgba(7,13,32,.7), 0 0 0 10px rgba(232,201,138,.45), 0 24px 50px rgba(0,0,0,.5), inset 0 0 60px rgba(232,201,138,.12); }
  .t8 .ev .tm { color: #0d1733; }

     radial-gradient(1.5px 1.5px at 90% 44%, rgba(243,220,166,.6), transparent), radial-gradient(1px 1px at 8% 58%, rgba(243,220,166,.7), transparent),
     radial-gradient(1.5px 1.5px at 20% 86%, rgba(243,220,166,.6), transparent), radial-gradient(1px 1px at 76% 90%, rgba(243,220,166,.7), transparent),
     radial-gradient(1px 1px at 50% 6%, rgba(243,220,166,.7), transparent), radial-gradient(1.5px 1.5px at 94% 72%, rgba(243,220,166,.6), transparent); }

  /* ========== 9. BLUSH ROSE FLORAL ========== */

  .d9 .f3 { bottom: -110px; left: -110px; transform: scaleY(-1); width: 340px; height: 340px; } .d9 .f4 { bottom: -110px; right: -110px; transform: scale(-1,-1); width: 340px; height: 340px; }
  .d9 .frame { inset: 40px; border: 1.5px solid rgba(183,110,121,.45); border-radius: 6px; }
  .rg { background: linear-gradient(120deg,#9c5a5f 0%,#d9a08f 30%,#b4737a 50%,#e8bba6 72%,#9c5a5f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .d9 .side .tm { display: inline-block; margin-top: 16px; padding: 8px 26px; border-radius: 999px; background: linear-gradient(120deg,#b4737a,#e3a99a 50%,#b4737a);

  .d9 .venue { font-family: "Cormorant Garamond"; font-size: 30px; margin-top: 28px; color: #6b3a3f; }

  .d9 .foot { left: 0; right: 0; bottom: 70px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .d9 .qr { background: #fff; box-shadow: 0 0 0 1.5px rgba(183,110,121,.5); }
  .d9 .qr img, .d9 .qr canvas { width: 118px !important; height: 118px !important; }

function mandala(rings) {
  let s = "";
  rings.forEach(([n, rx, ry, dist, sw]) => { for (let i = 0; i < n; i++) s += `<ellipse cx="0" cy="-${dist}" rx="${rx}" ry="${ry}" transform="rotate(${360 / n * i})" fill="none" stroke="currentColor" stroke-width="${sw}"/>`; });
  [40, 92, 150, 192].forEach(r => s += `<circle r="${r}" fill="none" stroke="currentColor" stroke-width=".7"/>`);
  for (let i = 0; i < 72; i++) s += `<circle cx="0" cy="-198" r="1.8" fill="currentColor" transform="rotate(${i * 5})"/>`;
  return `<svg class="abs mandala" viewBox="-200 -200 400 400">${s}</svg>`;
}
const M = () => mandala([[12, 14, 40, 52, 1.1], [24, 9, 30, 120, .9], [36, 5, 22, 170, .7], [8, 26, 60, 70, .7]]);

function branch(cls) {
  // curved stem with paired leaves
  let s = `<path d="M40 40 Q 260 120 470 420" fill="none" stroke="currentColor" stroke-width="3"/>`;
  for (let i = 1; i < 12; i++) {
    const t = i / 12, x = (1 - t) * (1 - t) * 40 + 2 * (1 - t) * t * 260 + t * t * 470, y = (1 - t) * (1 - t) * 40 + 2 * (1 - t) * t * 120 + t * t * 420;
    const ang = 20 + t * 40, sz = 34 - t * 12, op = .55 + (i % 3) * .15;
    s += `<ellipse cx="${x}" cy="${y - sz}" rx="${sz * .42}" ry="${sz}" fill="currentColor" opacity="${op}" transform="rotate(${ang - 60} ${x} ${y})"/>`;
    s += `<ellipse cx="${x}" cy="${y - sz}" rx="${sz * .42}" ry="${sz}" fill="currentColor" opacity="${op - .15}" transform="rotate(${ang + 70} ${x} ${y})"/>`;
  }
  s += `<circle cx="150" cy="70" r="12" fill="#e9d3c0"/><circle cx="150" cy="70" r="5" fill="#c9a36a"/><circle cx="330" cy="215" r="9" fill="#e9d3c0"/><circle cx="330" cy="215" r="4" fill="#c9a36a"/>`;
  return `<svg class="branch ${cls}" viewBox="0 0 560 560">${s}</svg>`;
}

function toran() {
  let s = `<path d="M0 18 Q 492 70 984 18" fill="none" stroke="#f2b51c" stroke-width="4"/>`;
  const n = 25;
  for (let i = 0; i <= n; i++) {
    const x = 984 * i / n, y = 18 + 52 * (1 - Math.pow((x - 492) / 492, 2));
    if (i % 2 === 0) {
      const len = 92 + (i % 4 === 0 ? 18 : 0), g = i % 4 === 0 ? "#2f7d32" : "#4f9a3a";
      s += `<path d="M${x} ${y} C ${x - 20} ${y + len * .35}, ${x - 12} ${y + len * .8}, ${x} ${y + len} C ${x + 12} ${y + len * .8}, ${x + 20} ${y + len * .35}, ${x} ${y}z" fill="${g}" stroke="#1f5a22" stroke-width="1.2"/>`;
      s += `<path d="M${x} ${y + 4} L ${x} ${y + len - 6}" stroke="#a8d08d" stroke-width="1.2"/>`;
    } else {
      for (let k = 0; k < 3; k++) s += `<circle cx="${x}" cy="${y + 16 + k * 24}" r="${12 - k}" fill="${k % 2 ? "#f2b51c" : "#f57c00"}"/><circle cx="${x}" cy="${y + 16 + k * 24}" r="4" fill="#c25e00"/>`;
    }
  }
  return `<svg class="toran" viewBox="0 0 984 200">${s}</svg>`;
}

function deco(cls) {
  let s = "";
  for (let i = 0; i <= 18; i++) { const a = Math.PI * i / 18; s += `<line x1="540" y1="0" x2="${540 + Math.cos(a) * 175}" y2="${Math.sin(a) * 175}" stroke="currentColor" stroke-width="1" opacity=".35"/>`; }
  [90, 130, 170].forEach((r, i) => s += `<path d="M${540 - r} 0 A ${r} ${r} 0 0 0 ${540 + r} 0" fill="none" stroke="currentColor" stroke-width="${i === 1 ? 2 : 1}"/>`);
  return `<svg class="deco ${cls}" viewBox="0 0 1080 260"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#041a17" stop-opacity="0"/><stop offset="1" stop-color="#08302a" stop-opacity=".9"/></linearGradient></defs>${s}</svg>`;
}

function rose(x, y, r, c1, c2) {
  let s = "";
  for (let k = 0; k < 3; k++) { const rr = r * (1 - k * .28), n = 6 - k;
    for (let i = 0; i < n; i++) { const a = 360 / n * i + k * 23;
      s += '<ellipse cx="' + x + '" cy="' + (y - rr * .45) + '" rx="' + rr * .55 + '" ry="' + rr * .6 + '" fill="' + (k % 2 ? c2 : c1) + '" opacity=".92" transform="rotate(' + a + ' ' + x + ' ' + y + ')"/>'; } }
  return s + '<circle cx="' + x + '" cy="' + y + '" r="' + r * .16 + '" fill="' + c2 + '"/>';
}
function leaf(x, y, l, a, c) { return '<path d="M' + x + ' ' + y + ' q ' + l * .35 + ' ' + (-l * .3) + ' ' + l + ' 0 q ' + (-l * .65) + ' ' + l * .3 + ' ' + (-l) + ' 0z" fill="' + c + '" transform="rotate(' + a + ' ' + x + ' ' + y + ')"/>'; }
function floral(cls) {
  let s = "";
  [[95, 300, 70, -10], [300, 90, 70, 20], [200, 380, 60, 60], [380, 220, 55, -30], [60, 120, 50, 40], [420, 70, 50, 10]].forEach(([x, y, l, a]) => s += leaf(x, y, l, a, a % 20 ? "#9fb59a" : "#b7c9ae"));
  s += rose(170, 170, 92, "#e7a9a4", "#d38a8a") + rose(320, 140, 58, "#f3c6bd", "#e3a99a") + rose(130, 330, 54, "#f6d6cc", "#e7b4a8") + rose(270, 270, 34, "#f8e1d8", "#ecc0b0");

}

  for (let i = 0; i < 46; i++) { const y = 140 + i * 8, w = 50 + Math.sin(i / 46 * Math.PI) * 60;
    s += '<path d="M178 ' + y + ' q ' + (-w * .6) + ' -14 ' + (-w) + ' -30" stroke="#2fa38f" stroke-width="1.6" fill="none" opacity=".75"/><path d="M178 ' + y + ' q ' + w * .6 + ' -14 ' + w + ' -30" stroke="#2fa38f" stroke-width="1.6" fill="none" opacity=".75"/>'; }
  s += '<ellipse cx="180" cy="110" rx="78" ry="96" fill="#1f8a7a"/><ellipse cx="180" cy="116" rx="58" ry="72" fill="#d4af6a"/><ellipse cx="180" cy="122" rx="44" ry="56" fill="#0e7c86"/><ellipse cx="180" cy="128" rx="28" ry="36" fill="#173a8c"/><ellipse cx="180" cy="132" rx="12" ry="16" fill="#071a3d"/>';
  return '<svg class="fe ' + cls + '" viewBox="0 0 360 520">' + s + '</svg>';
}
function bells() {
  let s = '<path d="M150 6 Q 540 40 930 6" stroke="#d4af6a" stroke-width="2" fill="none"/>';
  [250, 330, 750, 830].forEach((x, i) => { const y = 6 + 34 * (1 - Math.pow((x - 540) / 390, 2)), L = 22 + (i % 2) * 18;
    s += '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y + L) + '" stroke="#d4af6a" stroke-width="1.5"/><path d="M' + (x - 16) + ' ' + (y + L + 36) + ' q 0 -34 16 -36 q 16 2 16 36z" fill="#d4af6a"/><circle cx="' + x + '" cy="' + (y + L + 40) + '" r="5" fill="#f3dca6"/>'; });
  return '<svg class="bells" viewBox="0 0 1080 130">' + s + '</svg>';
}
